[package]
name = "file-integrity-rs"
version = "0.1.0"
edition = "2021"
description = "File integrity monitor — baseline, check, diff"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
